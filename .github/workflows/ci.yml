name: ADTNM CI - Automated Verification & Regression Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build, Unit Tests & Empirical Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ADTNM Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib seaborn numpy

      - name: Clone Fresh The ONE Simulator
        run: |
          git clone --depth 1 https://github.com/akeranen/the-one.git ../the-one

      - name: Deploy Autonomic DTNMA Framework into The ONE
        run: |
          python install.py --one-dir ../the-one

      - name: Compile & Run ADTNM Java Unit Tests
        run: |
          javac -cp "../the-one/target:../the-one/lib/ECLA.jar:../the-one/lib/DTNConsoleConnection.jar" -d ../the-one/target tests/DtnmaUnitTests.java
          java -cp "../the-one/target:../the-one/lib/ECLA.jar:../the-one/lib/DTNConsoleConnection.jar" DtnmaUnitTests

      - name: Run 1-Hour DTNMA Smoke Benchmark & Verify ARI Audit Trace
        run: |
          cd ../the-one
          bash one.sh -b 1 scenarios/scenario_dtnma.txt
          python -c "from pathlib import Path; m=Path('reports/Dtnma_Benchmark_MessageStatsReport.txt').read_text(); d=Path('reports/Dtnma_Benchmark_DtnmaMetricsReport.txt').read_text(); a=Path('reports/Dtnma_Benchmark_DtnmaAuditReport.txt').read_text(); assert 'shield_decisions_total:' in d, 'DtnmaMetricsReport missing'; assert 'traceable_ari_ratio: 1.0000' in a, 'ARI audit trace failed'; print('Smoke benchmark, DtnmaMetricsReport & 100% ARI traceability verified.')"
